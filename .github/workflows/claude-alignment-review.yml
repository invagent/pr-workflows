# .github/workflows/claude-alignment-review.yml
#
# 2026-09-09 起本工作流的职责已变更：
#   旧：本体—PRD—代码一致性审查（读本体分片 + 数据库字典做双向比对）
#   新：PR 变更影响分析（只看 diff 与代码本身，产出变更清单、调用链影响、
#       数据与外部依赖、测试与风险提示）——**不再读本体，不再与数据库字典做任何比对**
#
# 文件名与 job id 刻意保持不变：消费方的 `uses:` 引用与 PR check 名（alignment-review /
# alignment-review）因此不受影响，在途 PR 分支上的旧消费方文件也无需同步修改。
name: PR Change Impact Analysis

on:
  workflow_call:
    inputs:
      # ⚠️ 以下 4 个入参已废弃（本工作流不再消费本体与数据库字典）。
      # 保留声明仅为兼容在途 PR 分支上的旧消费方文件——传了会被忽略，不会报错。
      ontology_repo:
        description: '【已废弃】本体仓库，保留仅为兼容旧消费方，不再使用'
        required: false
        type: string
        default: 'invagent/document'
      ontology_path:
        description: '【已废弃】本体目录，保留仅为兼容旧消费方，不再使用'
        required: false
        type: string
        default: '.'
      db_mapping_repo:
        description: '【已废弃】数据库字典仓库，保留仅为兼容旧消费方，不再使用'
        required: false
        type: string
        default: 'invagent/fpy-sql-ontology'
      db_mapping_path:
        description: '【已废弃】数据库字典目录，保留仅为兼容旧消费方，不再使用'
        required: false
        type: string
        default: '.'
      feature_scope:
        description: '关注点提示（可选）。非空时分析会围绕它展开，留空则由 PR 标题与变更自行推断'
        required: false
        type: string
        default: ''
      comment_mode:
        description: >-
          报告怎么呈现。standalone：模型自己往 PR 发一条报告评论（默认，单独接入时用）；
          aggregated：不发评论，上传 pr-check-impact artifact 交给 pr-summary 汇总成一条
        required: false
        type: string
        default: 'standalone'
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ANTHROPIC_BASE_URL:
        required: false
      ANTHROPIC_MODEL:
        required: false
      SUBMODULE_TOKEN:
        description: '【已废弃】不再拉取 submodule，保留仅为兼容旧消费方'
        required: false
      ONTOLOGY_REPO_TOKEN:
        description: '【已废弃】保留仅为兼容旧消费方'
        required: false
      DB_MAPPING_REPO_TOKEN:
        description: '【已废弃】保留仅为兼容旧消费方'
        required: false
      ARTIFACTS_REPO_TOKEN:
        required: false
      YUNZHIJIA_NOTIFY_URL:
        required: false
      YUNZHIJIA_ACCESS_TOKEN:
        required: false

jobs:
  alignment-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: alignment-review-${{ github.event.pull_request.number }}-${{ github.repository }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 需要 diff，获取完整历史
          submodules: false    # 影响面分析只看主仓库代码，不需要本体/数据库字典 submodule

      - name: Detect Java project
        id: detect-java
        run: |
          if find . -name "*.java" -not -path "./.git/*" | head -1 | grep -q "."; then
            echo "is_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_java=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build change index (diff split + symbols + callers + deps)
        id: change-index
        if: steps.detect-java.outputs.is_java == 'true'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          OUT: /tmp
        run: |
          # 生成"变更索引"：把 diff 切分、变更符号提取、调用点预扫、表与外部依赖识别、
          # 测试对应关系等机械活在 shell 里做完，Claude 只读索引 + 关键 patch 做判断与叙述。
          # 本步骤**不读本体、不读数据库字典**。
          set -uo pipefail

          MAX_PATCH_BYTES=350000
          mkdir -p "$OUT"

          # ---------- 1. 变更清单（按用途分类） ----------
          git diff --name-only "$BASE_REF...HEAD" > "$OUT/pr-changed-files.txt" 2>/dev/null || true
          grep -E '^src/main/java/'      "$OUT/pr-changed-files.txt" > "$OUT/pr-main-files.txt"   2>/dev/null || true
          grep -E '^src/test/'           "$OUT/pr-changed-files.txt" > "$OUT/pr-test-files.txt"   2>/dev/null || true
          grep -E '\.(sql|xml)$'         "$OUT/pr-changed-files.txt" > "$OUT/pr-data-files.txt"   2>/dev/null || true
          grep -E '(pom\.xml|\.ya?ml|\.properties|^\.github/)' "$OUT/pr-changed-files.txt" > "$OUT/pr-config-files.txt" 2>/dev/null || true
          touch "$OUT/pr-main-files.txt" "$OUT/pr-test-files.txt" "$OUT/pr-data-files.txt" "$OUT/pr-config-files.txt"

          git diff --stat "$BASE_REF...HEAD" > "$OUT/pr-diff-stat.txt" 2>/dev/null || true

          # ---------- 2. 主代码 diff + 按文件切分 ----------
          git diff "$BASE_REF...HEAD" -- 'src/main' 'pom.xml' > "$OUT/.main-diff.raw" 2>/dev/null || true
          PATCH_BYTES=$(wc -c < "$OUT/.main-diff.raw" | tr -d ' ')
          if [ "${PATCH_BYTES:-0}" -gt "$MAX_PATCH_BYTES" ]; then
            {
              echo "# TRUNCATED=true 原始 ${PATCH_BYTES} 字节，此处只含前 ${MAX_PATCH_BYTES} 字节"
              echo "# 完整内容请按文件读 pr-diff/ 下的单文件 patch"
              head -c "$MAX_PATCH_BYTES" "$OUT/.main-diff.raw"
            } > "$OUT/pr-main-diff.patch"
          else
            { echo "# TRUNCATED=false 共 ${PATCH_BYTES} 字节"; cat "$OUT/.main-diff.raw"; } > "$OUT/pr-main-diff.patch"
          fi

          python3 - "$OUT" <<'PYSPLIT'
          import os, re, sys

          out = sys.argv[1]
          shard_dir = os.path.join(out, "pr-diff")
          os.makedirs(shard_dir, exist_ok=True)
          for f in os.listdir(shard_dir):
              os.remove(os.path.join(shard_dir, f))

          raw_path = os.path.join(out, ".main-diff.raw")
          raw = open(raw_path, encoding="utf-8", errors="replace").read() if os.path.exists(raw_path) else ""
          blocks = re.split(r"(?m)^(?=diff --git )", raw)
          index = []
          for blk in blocks:
              m = re.match(r"diff --git a/(\S+) b/(\S+)", blk)
              if not m:
                  continue
              path = m.group(2)
              flat = path.replace("/", "__") + ".patch"
              with open(os.path.join(shard_dir, flat), "w", encoding="utf-8") as f:
                  f.write(blk)
              added = sum(1 for l in blk.splitlines() if l.startswith("+") and not l.startswith("+++"))
              removed = sum(1 for l in blk.splitlines() if l.startswith("-") and not l.startswith("---"))
              index.append((path, flat, added, removed, len(blk)))

          index.sort(key=lambda x: -x[2])
          with open(os.path.join(out, "pr-diff-files-index.txt"), "w", encoding="utf-8") as f:
              f.write("# 主代码 diff 已按文件切分，按新增行数降序。看某文件改动直接读右侧 patch，不要整包读 pr-main-diff.patch\n")
              f.write("# 格式：+新增/-删除\t字节数\t源文件\t->\tpatch 文件\n")
              for path, flat, added, removed, size in index:
                  f.write("+%d/-%d\t%d\t%s\t->\t%s\n" % (added, removed, size, path, os.path.join(out, "pr-diff", flat)))
          print("[diff-split] 切分 %d 个文件级 patch" % len(index))
          PYSPLIT

          # ---------- 3. 变更符号 + 调用点 + 入口 + 数据/外部依赖 + 测试对应 ----------
          python3 - "$OUT" <<'PYIMPACT'
          import os, re, subprocess, sys
          from collections import defaultdict

          out = sys.argv[1]

          def read_lines(name):
              p = os.path.join(out, name)
              return [l.strip() for l in open(p, encoding="utf-8")] if os.path.exists(p) else []

          main_files = [f for f in read_lines("pr-main-files.txt") if f]
          data_files = [f for f in read_lines("pr-data-files.txt") if f]
          test_files = [f for f in read_lines("pr-test-files.txt") if f]

          raw_path = os.path.join(out, ".main-diff.raw")
          raw = open(raw_path, encoding="utf-8", errors="replace").read() if os.path.exists(raw_path) else ""

          # --- 3.1 从 diff 变更行里提取方法与类符号（机器初筛，可能误报） ---
          # 方法名要求首字母小写（Java 惯例），且类型声明行优先判定并跳过——
          # 否则 `public record AgentProduct(...) {` 会被误当成名为 AgentProduct 的方法。
          DECL_RE = re.compile(
              r'^[+-]\s*(?:public|protected|private|final|abstract|static|sealed|\s)*'
              r'(?:class|interface|enum|record|@interface)\s+(\w+)')
          METHOD_RE = re.compile(
              r'^[+-]\s*(?:@\w+\s*)*(?:public|protected|private|static|final|abstract|synchronized|\s)*'
              r'[\w.<>\[\],?\s]+\s+([a-z]\w*)\s*\([^;]*\)\s*(?:throws [\w.,\s]+)?\s*\{')
          SKIP = {"if", "for", "while", "switch", "catch", "return", "new", "try", "do", "else", "synchronized"}

          cur_file, changed_methods, changed_types = None, defaultdict(set), defaultdict(set)
          for line in raw.splitlines():
              m = re.match(r"\+\+\+ b/(\S+)", line)
              if m:
                  cur_file = m.group(1)
                  continue
              if not cur_file or not cur_file.endswith(".java"):
                  continue
              cm = DECL_RE.match(line)
              if cm:
                  changed_types[cur_file].add(cm.group(1))
                  continue
              mm = METHOD_RE.match(line)
              if mm and mm.group(1) not in SKIP:
                  changed_methods[cur_file].add(mm.group(1))

          with open(os.path.join(out, "changed-symbols.txt"), "w", encoding="utf-8") as f:
              f.write("# 本次 diff 中出现在增删行上的方法与类型（正则初筛，可能有误报/漏报，作为线索用）\n")
              for path in sorted(set(changed_methods) | set(changed_types)):
                  f.write("\n## %s\n" % path)
                  if changed_types.get(path):
                      f.write("类型：%s\n" % ", ".join(sorted(changed_types[path])))
                  if changed_methods.get(path):
                      f.write("方法：%s\n" % ", ".join(sorted(changed_methods[path])))

          # --- 3.2 调用点预扫：这些方法在全仓被谁调用 ---
          all_methods = sorted({m for s in changed_methods.values() for m in s})
          callers = defaultdict(list)
          if all_methods:
              pattern = r'\.(' + '|'.join(re.escape(m) for m in all_methods) + r')\s*\('
              try:
                  res = subprocess.run(["grep", "-rnoE", pattern, "src/"],
                                       capture_output=True, text=True)
                  for line in res.stdout.splitlines():
                      parts = line.split(":", 2)
                      if len(parts) != 3:
                          continue
                      path, lineno, hit = parts
                      name = hit.strip().lstrip(".").rstrip("(").strip()
                      callers[name].append((path, lineno))
              except Exception as e:
                  print("::warning::调用点扫描失败: %s" % e)

          # 按主代码调用点数降序，只详列前 MAX_METHODS 个——调用方越多的方法影响面越大，
          # 尾部那些零调用点的访问器/私有方法列出来只是噪声。
          MAX_METHODS = 80
          # 通用短名（of / get / build …）在全仓命中成百上千处，几乎全是同名无关方法，
          # 拿它们统计影响面只会淹没真正的调用链，单独归一节即可。
          GENERIC_NAMES = {"of", "get", "set", "run", "build", "apply", "test", "value", "name", "id",
                           "from", "valueOf", "create", "execute", "handle", "accept", "call", "close",
                           "start", "stop", "toString", "equals", "hashCode", "compareTo", "size",
                           "isEmpty", "stream", "map", "filter", "add", "put", "remove", "contains"}
          # 黑名单穷举不完（isBlank 这类工具方法同样命中上百处），再补一条通用规则：
          # 一个 PR 改动的业务方法不该有 50+ 个主代码调用方，超了基本可断定是同名工具方法。
          def main_hits_of(n):
              return len([h for h in callers.get(n, []) if h[0].startswith("src/main/")])

          generic = [n for n in all_methods
                     if n in GENERIC_NAMES or len(n) <= 3 or main_hits_of(n) > 50]
          specific = [n for n in all_methods if n not in generic]
          ranked = sorted(specific,
                          key=lambda n: -len([h for h in callers.get(n, []) if h[0].startswith("src/main/")]))
          with open(os.path.join(out, "caller-index.txt"), "w", encoding="utf-8") as f:
              f.write("# 变更方法 -> 全仓调用点（grep 初筛，同名方法会混入，需按上下文判断）\n")
              f.write("# 按主代码调用点数降序。没有调用点的方法要么是入口（被框架调用）、要么是 record 访问器，\n")
              f.write("# 要么可能是死代码——后两种只在明显可疑时才值得写进报告\n")
              for name in ranked[:MAX_METHODS]:
                  hits = callers.get(name, [])
                  main_hits = [h for h in hits if h[0].startswith("src/main/")]
                  test_hits = [h for h in hits if h[0].startswith("src/test/")]
                  f.write("\n## %s  （主代码 %d 处 / 测试 %d 处）\n" % (name, len(main_hits), len(test_hits)))
                  for path, lineno in main_hits[:10]:
                      f.write("%s:%s\n" % (path, lineno))
                  if len(main_hits) > 10:
                      f.write("... 其余 %d 处主代码调用省略\n" % (len(main_hits) - 10))
              if len(ranked) > MAX_METHODS:
                  f.write("\n# 另有 %d 个变更方法主代码调用点为 0 或很少，未详列：%s\n"
                          % (len(ranked) - MAX_METHODS, ", ".join(ranked[MAX_METHODS:])))
              if generic:
                  f.write("\n# 以下变更方法是通用短名，全仓同名命中过多、调用点统计不可信，未统计：%s\n"
                          % ", ".join(sorted(generic)))

          # --- 3.3 入口识别：改动是否触及对外入口 ---
          # 只认注解与 implements 这类硬特征，且先剔除注释行——
          # 按类名猜（Orchestrator/Sweeper）或全文匹配会把注释里提到的词也算成入口。
          ENTRY_PATTERNS = [
              (r'@(Rest)?Controller\b|@(Get|Post|Put|Delete|Patch|Request)Mapping\b', 'HTTP 接口'),
              (r'@Scheduled\b|implements\s+ScheduledJob\b', '定时任务'),
              (r'@KafkaListener\b|@RabbitListener\b|@EventListener\b', '消息/事件消费'),
              (r'@FeignClient\b|\bRestTemplate\b|\bWebClient\b|\bHttpClient\b|\bHttpUtil\b|\bOkHttp\w*\b', '外部 HTTP/RPC 调用'),
              (r'@Transactional\b', '事务边界'),
          ]
          with open(os.path.join(out, "entrypoints-and-deps.txt"), "w", encoding="utf-8") as f:
              f.write("# 变更文件里命中的入口与依赖特征（按注解/implements 硬特征匹配，已剔除注释行）\n")
              for path in main_files:
                  if not os.path.exists(path):
                      continue
                  code = "\n".join(l for l in open(path, encoding="utf-8", errors="replace").read().splitlines()
                                   if not l.lstrip().startswith(("*", "//", "/*")))
                  hits = [label for pat, label in ENTRY_PATTERNS if re.search(pat, code)]
                  if hits:
                      f.write("%s\t%s\n" % (path, "、".join(sorted(set(hits)))))

          # --- 3.4 数据依赖：涉及哪些表、什么操作（只罗列，不与任何字典比对） ---
          # 不拿 SELECT 后面的词当表名（那是列），CREATE TABLE 要吃掉 IF NOT EXISTS，
          # 再用关键字黑名单 + "全大写视为 SQL 函数/常量" 兜住剩余噪声。
          TABLE_RE = re.compile(
              r'\b(INSERT\s+INTO|UPDATE|DELETE\s+FROM|FROM|JOIN|CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?)'
              r'\s+`?([a-zA-Z_][a-zA-Z0-9_]*)`?', re.I)
          SQL_NOISE = {"select", "where", "set", "values", "as", "on", "id", "dual", "if", "not",
                       "exists", "table", "into", "from", "join", "and", "or", "case", "when",
                       "then", "else", "end", "order", "group", "by", "limit", "offset", "union"}
          ops = defaultdict(set)
          for path in data_files:
              if not os.path.exists(path):
                  continue
              text = open(path, encoding="utf-8", errors="replace").read()
              for kw, table in TABLE_RE.findall(text):
                  if table.lower() in SQL_NOISE or table.isupper():
                      continue
                  k = kw.upper().split()[0]
                  verb = {"FROM": "查", "JOIN": "查", "INSERT": "增",
                          "UPDATE": "改", "DELETE": "删", "CREATE": "建表"}.get(k, k)
                  ops[table].add(verb)
          with open(os.path.join(out, "data-touchpoints.txt"), "w", encoding="utf-8") as f:
              f.write("# 变更的 SQL / mapper XML 里涉及的表与操作（grep 初筛，仅罗列现状，不做任何字典比对）\n")
              for table in sorted(ops):
                  f.write("%s\t%s\n" % (table, "/".join(sorted(ops[table]))))

          # --- 3.5 测试对应关系：改了主代码类，有没有同名测试 ---
          with open(os.path.join(out, "test-coverage-map.txt"), "w", encoding="utf-8") as f:
              f.write("# 主代码类 -> 同名测试是否存在 / 本次是否一起改（按文件名匹配，非覆盖率）\n")
              changed_test_names = {os.path.basename(t) for t in test_files}
              for path in main_files:
                  if path.endswith("package-info.java"):
                      continue      # 包声明文件没有测试可言，列出来只是噪声
                  cls = os.path.basename(path).replace(".java", "")
                  test_name = cls + "Test.java"
                  found = subprocess.run(["find", "src/test", "-name", test_name],
                                         capture_output=True, text=True).stdout.strip()
                  if not found:
                      state = "❌ 无同名测试"
                  elif test_name in changed_test_names:
                      state = "✅ 存在且本次一起改了"
                  else:
                      state = "⚠️ 存在但本次未改"
                  f.write("%s\t%s\n" % (path, state))

          print("[impact] 变更方法 %d 个，命中调用点 %d 个，涉及表 %d 张"
                % (len(all_methods), sum(len(v) for v in callers.values()), len(ops)))
          PYIMPACT

          # ---------- 4. 汇总摘要 ----------
          {
            echo "# 变更影响索引摘要（下列路径均已就绪，可直接读）"
            echo "变更文件总数：$(wc -l < "$OUT/pr-changed-files.txt" | tr -d ' ')"
            echo "主代码(java)：$(wc -l < "$OUT/pr-main-files.txt" | tr -d ' ')   清单：$OUT/pr-main-files.txt"
            echo "测试：        $(wc -l < "$OUT/pr-test-files.txt" | tr -d ' ')   清单：$OUT/pr-test-files.txt"
            echo "SQL/XML：     $(wc -l < "$OUT/pr-data-files.txt" | tr -d ' ')   清单：$OUT/pr-data-files.txt"
            echo "配置：        $(wc -l < "$OUT/pr-config-files.txt" | tr -d ' ')   清单：$OUT/pr-config-files.txt"
            echo ""
            echo "索引文件："
            echo "  $OUT/pr-diff-files-index.txt    按文件切分的 diff 索引（按新增行降序）"
            echo "  $OUT/pr-diff/<flat>.patch       单文件 diff"
            echo "  $OUT/changed-symbols.txt        变更涉及的类与方法"
            echo "  $OUT/caller-index.txt           变更方法 -> 全仓调用点"
            echo "  $OUT/entrypoints-and-deps.txt   入口与外部依赖特征（HTTP/定时/消息/事务）"
            echo "  $OUT/data-touchpoints.txt       涉及的表与操作"
            echo "  $OUT/test-coverage-map.txt      主代码类与同名测试的对应关系"
            echo "  $OUT/pr-diff-stat.txt           整体 diff 规模"
          } > "$OUT/change-brief.txt"
          cat "$OUT/change-brief.txt"

          rm -f "$OUT/.main-diff.raw"

      - name: Claude Change Impact Analysis
        id: claude-alignment-review
        if: steps.detect-java.outputs.is_java == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            你是"PR 变更影响分析员"。任务是把本次 Pull Request 改了什么、会波及什么，讲清楚给评审人看。
            本任务只读：不要修改任何文件。

            ## 范围限定（硬性）

            - **不做本体一致性检查**：不要读 `docs/ontology/`，不要查任何 `ACT-*` / `FN-*` / `PRO-*` / `LNK-*` / `STS-*` / `RULE-*` 本体条目，
              也不要判断代码是否符合本体。代码里出现这类 ID 时，当作普通标识符看待即可。
            - **不做数据库字典比对**：不要读 `docs/db-mapping/`，不要打开 `schema.json`，
              不要判断某个列/表是否"存在于字典中"。涉及的表只做罗列，不做存在性或一致性判定。
            - 上述两件事已有专门的门禁与流程负责，本工作流不重复。

            ## 基本信息

            - REPO: ${{ github.repository }}
            - PR NUMBER: ${{ github.event.pull_request.number }}
            - PR TITLE: ${{ github.event.pull_request.title }}
            - AUTHOR: ${{ github.event.pull_request.user.login }}
            - BASE BRANCH: ${{ github.base_ref }}
            - 关注点（可为空）: ${{ inputs.feature_scope }}

            ## 已备好的索引（先读这些，别自己从头扫仓库）

            - `/tmp/change-brief.txt`           摘要与各索引路径（第一轮必读）
            - `/tmp/pr-diff-files-index.txt`    主代码 diff 按文件切分索引（按新增行降序）
            - `/tmp/pr-diff/<flat>.patch`       单文件 diff
            - `/tmp/changed-symbols.txt`        变更涉及的类与方法（正则初筛）
            - `/tmp/caller-index.txt`           变更方法 → 全仓调用点（grep 初筛）
            - `/tmp/entrypoints-and-deps.txt`   入口与依赖特征（HTTP 接口 / 定时任务 / 消息消费 / 外部调用 / 事务）
            - `/tmp/data-touchpoints.txt`       涉及的表与操作（增删改查）
            - `/tmp/test-coverage-map.txt`      主代码类与同名测试的对应关系
            - `/tmp/pr-changed-files.txt` 及分类清单、`/tmp/pr-diff-stat.txt`

            索引里的调用点、符号、表名都是 **grep/正则初筛**，同名方法会混入、也可能漏。
            写进报告前按需读对应 patch 或源码确认，但**不要为了穷尽而逐个核实**——拿不准的写"待确认"，不要死磕。

            ## 取证纪律

            1. 一次 Bash 调用里用 `;` 串多条 `cat`/`grep`/`sed`，不要一条命令一次调用。
            2. 按 `/tmp/pr-diff-files-index.txt` 优先读新增行最多的主代码 patch；测试文件按需抽查，不必逐个读。
            3. **边分析边写**：每完成一个章节，立刻用 `cat >>` 追加进 `/tmp/pr-impact-report.md`，
               不要攒到最后一次性写——这样即使中途中断，也有部分结果可用。
            4. 不确定的结论标注"待确认"并说明缺什么信息，不要靠猜补齐，也不要为一个细节反复查证。

            ## 分析内容（四块，逐块产出）

            ### 1. 变更清单与规模
            按主代码 / 测试 / SQL·XML / 配置分类，给出文件数与增删行数，并用一两句话说明这次改动**在做什么**。
            对主要文件逐条给出"改了什么"的一句话说明（只列有实质改动的，重命名/格式化归并成一行）。

            ### 2. 调用链影响
            - 新增或修改的**对外入口**：HTTP 接口、定时任务、消息/事件消费（依据 `entrypoints-and-deps.txt`）
            - 被修改或删除的方法**有哪些调用点**、这些调用方会受什么影响（依据 `caller-index.txt`）
            - 主代码里**没有任何调用点**的新增方法：是入口（被框架反射调用）还是可能的死代码
            - 一句话结论：本次改动的波及半径（只影响自身模块 / 波及 N 个上游调用方 / 触及对外契约）

            ### 3. 数据与外部依赖
            - 涉及哪些数据库表、各是什么操作（增/删/改/查/建表），依据 `data-touchpoints.txt`
            - 有无新增或改动的外部 HTTP/RPC 调用，调用了谁
            - 有无事务边界、批量操作、定时扫描这类需要留意的数据行为
            - **只描述现状，不判断这些表/列是否符合任何字典或规范**

            ### 4. 测试与风险提示
            - 依据 `test-coverage-map.txt`：哪些主代码改动有对应测试且本次一起改了、哪些没有
            - 风险点，按以下三级标注：
              - 🔴 高：可能导致线上功能不可用、数据错误、外部业务重复执行
              - 🟡 中：边界场景、并发/幂等、失败处理不完整、关键路径缺测试
              - 🔵 低：可读性、命名、非关键测试缺失
            - 风险要有依据（指到具体文件与行），不要泛泛而谈"建议加强测试"

            ## 输出

            1. 全程用 `cat >>` 增量写入 `/tmp/pr-impact-report.md`，**首行必须是** `HAS_RISKS`（有 🔴/🟡）或 `NO_RISKS`，
               第二行空行，第三行起为报告正文，格式如下（不要额外加章节）：

            ```markdown
            # PR 变更影响分析

            ## 1. 概览
            - 变更规模：N 个文件（主代码 A / 测试 B / SQL·XML C / 配置 D），+X/-Y 行
            - 这次改动在做什么：一到两句话
            - 波及半径：一句话
            - 风险：🔴 N | 🟡 N | 🔵 N

            ## 2. 变更清单
            | 文件 | 类型 | 改了什么 |
            |---|---|---|
            | `路径` | 新增/修改/删除 | 一句话 |

            ## 3. 调用链影响
            （对外入口、调用点受影响情况、无调用点的新增方法；无影响时写"仅影响自身模块，无外部调用方"）

            ## 4. 数据与外部依赖
            | 表 / 外部依赖 | 操作 | 出现位置 |
            |---|---|---|

            （无数据库与外部调用改动时写"无"）

            ## 5. 测试与风险提示
            | # | 级别 | 风险 | 位置 | 建议 |
            |---|---|---|---|---|
            | R-01 | 🟡 | 一句话 | `文件:行` | 具体动作 |

            测试对应情况：一到两句话
            ```

            2. 报告写完后按当前模式投递（当前模式：${{ inputs.comment_mode }}）：
               - `standalone`：用 `gh pr comment` 把 `/tmp/pr-impact-report.md` 的**正文部分**
                 （去掉首行标记与空行）发到 PR。
               - `aggregated`：**不要发任何 PR 评论**，报告文件写完即可，后续步骤会收走它。

          claude_args: |
            --allowedTools "Bash,Read,Glob,Grep,LS"
            --max-turns 60

      - name: Append model usage stats to review comment
        if: steps.detect-java.outputs.is_java == 'true' && steps.claude-alignment-review.outcome == 'success'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXEC_FILE: ${{ steps.claude-alignment-review.outputs.execution_file }}
          COMMENT_MODE: ${{ inputs.comment_mode }}
          CNY_RATE: '7.2'
          GH_TOKEN: ${{ github.token }}
        run: |
          # 把本次分析的模型消耗统计追加到 Claude 刚发的那条报告评论结尾。
          # 数据来自 claude-code-action 落盘的执行日志（result 事件的 usage / total_cost_usd）。
          # 取不到数据或找不到报告评论时只告警、不失败——统计是附加信息，不该阻断流程。
          EXEC_FILE="${EXEC_FILE:-}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            EXEC_FILE="${RUNNER_TEMP}/claude-execution-output.json"
          fi

          if [ ! -f "$EXEC_FILE" ]; then
            echo "::warning::未找到执行日志: $EXEC_FILE，跳过模型统计"
            exit 0
          fi

          python3 - "$EXEC_FILE" <<'PYSTATS'
          import json, os, subprocess, sys

          exec_file = sys.argv[1]
          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          rate = float(os.environ.get("CNY_RATE", "7.2"))
          MARKER = "【模型统计："

          # ---------- 1. 从执行日志提取用量 ----------
          try:
              data = json.load(open(exec_file, encoding="utf-8"))
          except Exception as e:
              print(f"::warning::执行日志解析失败: {e}，跳过模型统计")
              sys.exit(0)

          events = data if isinstance(data, list) else [data]
          result = next((e for e in reversed(events)
                         if isinstance(e, dict) and e.get("type") == "result"), None)

          def pick(usage, *names):
              """usage 字段在不同版本间有 snake_case / camelCase 两种写法，逐个试。"""
              for n in names:
                  v = usage.get(n)
                  if isinstance(v, (int, float)):
                      return int(v)
              return 0

          buckets = {"输入": 0, "输出": 0, "缓存写入": 0, "缓存读取": 0}
          cost = 0.0

          usage = (result or {}).get("usage") or {}
          if usage:
              buckets["输入"] = pick(usage, "input_tokens", "inputTokens")
              buckets["输出"] = pick(usage, "output_tokens", "outputTokens")
              buckets["缓存写入"] = pick(usage, "cache_creation_input_tokens", "cacheCreationInputTokens")
              buckets["缓存读取"] = pick(usage, "cache_read_input_tokens", "cacheReadInputTokens")

          # result 没带 usage（精简日志）时，回退累加每条 assistant 消息的 usage
          if sum(buckets.values()) == 0:
              for e in events:
                  if isinstance(e, dict) and e.get("type") == "assistant":
                      u = (e.get("message") or {}).get("usage") or {}
                      buckets["输入"] += pick(u, "input_tokens", "inputTokens")
                      buckets["输出"] += pick(u, "output_tokens", "outputTokens")
                      buckets["缓存写入"] += pick(u, "cache_creation_input_tokens", "cacheCreationInputTokens")
                      buckets["缓存读取"] += pick(u, "cache_read_input_tokens", "cacheReadInputTokens")

          if result and isinstance(result.get("total_cost_usd"), (int, float)):
              cost = float(result["total_cost_usd"])
          else:
              for m in ((result or {}).get("modelUsage") or {}).values():
                  if isinstance(m, dict) and isinstance(m.get("costUSD"), (int, float)):
                      cost += float(m["costUSD"])

          total = sum(buckets.values())
          if total == 0:
              print("::warning::执行日志里没有可用的 token 用量，跳过模型统计")
              sys.exit(0)

          parts = []
          for name, n in sorted(buckets.items(), key=lambda kv: -kv[1]):
              pct = n * 100.0 / total
              if pct >= 0.1:
                  parts.append(f"{name}占 {pct:.1f}%")

          stats = (f"{MARKER}token 总消耗 {total:,}，预估 ${cost:.2f}"
                   f"（≈ ¥{cost * rate:.1f}，按 {rate} 汇率折算）。"
                   f"token 占比：{'，'.join(parts)}】")
          print(stats)

          # ---------- 2. 投递统计 ----------
          # 汇总模式下本工作流不发评论，统计追加到报告文件末尾，随 artifact 一起进汇总评论
          if os.environ.get("COMMENT_MODE") == "aggregated":
              try:
                  with open("/tmp/pr-impact-report.md", "a", encoding="utf-8") as f:
                      f.write("\n\n---\n" + stats + "\n")
                  print("模型统计已追加到报告文件")
              except Exception as e:
                  print(f"::warning::统计写入报告文件失败（{e}）")
              sys.exit(0)

          try:
              raw = subprocess.run(
                  ["gh", "api", f"repos/{repo}/issues/{pr}/comments", "--paginate"],
                  capture_output=True, text=True, check=True).stdout
              comments = json.loads(raw)
          except Exception as e:
              print(f"::warning::读取 PR 评论失败（{e}），统计未追加")
              sys.exit(0)

          target = None
          for c in comments:
              if "PR 变更影响分析" in (c.get("body") or ""):
                  target = c          # 取最后一条匹配的（本次刚发的）
          if target is None:
              print("::warning::未找到影响分析报告评论，统计未追加")
              sys.exit(0)

          body = target["body"].rstrip()
          head, sep, _ = body.partition("\n\n---\n" + MARKER)
          if sep:
              body = head.rstrip()
          new_body = f"{body}\n\n---\n{stats}"

          try:
              subprocess.run(
                  ["gh", "api", "--method", "PATCH",
                   f"repos/{repo}/issues/comments/{target['id']}",
                   "-f", f"body={new_body}"],
                  capture_output=True, text=True, check=True)
              print(f"模型统计已追加到评论 {target['id']}")
          except subprocess.CalledProcessError as e:
              print(f"::warning::追加统计失败（{e.stderr.strip()[:200]}）")
          PYSTATS

      - name: Collect impact result (aggregated mode)
        # 带 always()：分析超轮次失败时报告也可能写了一部分，汇总里如实呈现比整块消失好
        if: always() && inputs.comment_mode == 'aggregated'
        run: |
          mkdir -p /tmp/pr-check-impact
          REPORT=/tmp/pr-impact-report.md

          if [ ! -f "$REPORT" ]; then
            echo "⚠️ 未产出分析报告，请查看 Actions 日志" > /tmp/pr-check-impact/status.txt
            echo "分析步骤未生成 /tmp/pr-impact-report.md。" > /tmp/pr-check-impact/body.md
            exit 0
          fi

          # 首行是约定的 HAS_RISKS / NO_RISKS 标记，用来定图标；风险计数取报告概览里那行
          FIRST=$(head -1 "$REPORT" | tr -d '\r')
          RISK_LINE=$(grep -m1 '风险：' "$REPORT" | sed 's/^[[:space:]]*-[[:space:]]*风险：//' || true)

          ICON="✅"
          [ "$FIRST" = "HAS_RISKS" ] && ICON="🟡"

          echo "${ICON} ${RISK_LINE:-已完成}" > /tmp/pr-check-impact/status.txt

          # 正文去掉首行标记与重复的一级标题（汇总评论的折叠块自带标题）
          tail -n +2 "$REPORT" | sed '/^# PR 变更影响分析$/d' | sed '1{/^$/d}' > /tmp/pr-check-impact/body.md

      - name: Publish check artifact (aggregated mode)
        if: always() && inputs.comment_mode == 'aggregated'
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-impact
          path: /tmp/pr-check-impact
          retention-days: 1

      - name: Save impact report to artifacts repo
        # 带 always()：分析步骤即使因超轮次失败，报告也可能已增量写了一部分，值得归档
        if: always() && steps.detect-java.outputs.is_java == 'true'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          LINEAR_ID=$(echo "$PR_TITLE ${{ github.event.pull_request.head.ref }}" \
            | grep -oiE '[A-Z]+-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')

          if [ -z "$LINEAR_ID" ]; then
            echo "No Linear issue ID found, skipping artifact upload"
            exit 0
          fi

          REPORT_FILE="/tmp/pr-impact-report.md"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "Report file not found, skipping artifact upload"
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${{ secrets.ARTIFACTS_REPO_TOKEN }}@github.com/invagent/develop-workflow-artifacts.git" \
            /tmp/artifacts-repo

          mkdir -p "/tmp/artifacts-repo/${LINEAR_ID}/impact-report"

          TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)
          cp "$REPORT_FILE" "/tmp/artifacts-repo/${LINEAR_ID}/impact-report/${TIMESTAMP}-PR.md"

          if [ ! -f "/tmp/artifacts-repo/${LINEAR_ID}/README.md" ]; then
            echo "# ${LINEAR_ID}" > "/tmp/artifacts-repo/${LINEAR_ID}/README.md"
            echo "" >> "/tmp/artifacts-repo/${LINEAR_ID}/README.md"
            echo "PR: https://github.com/${REPO}/pull/${PR_NUMBER}" >> "/tmp/artifacts-repo/${LINEAR_ID}/README.md"
          fi

          cd /tmp/artifacts-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "${LINEAR_ID}/"
          git commit -m "chore: add impact report for ${LINEAR_ID} PR#${PR_NUMBER}" || echo "Nothing to commit"
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify user via Yunzhijia
        if: steps.detect-java.outputs.is_java == 'true' && steps.claude-alignment-review.outcome == 'success'
        run: |
          AUTHOR_LOGIN="${{ github.event.pull_request.user.login }}"
          AUTHOR_NAME=$(gh api users/$AUTHOR_LOGIN --jq '.name // empty' 2>/dev/null || true)

          if [ -z "$AUTHOR_NAME" ]; then
            echo "No name found for $AUTHOR_LOGIN, skipping notification"
            exit 0
          fi

          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          curl -s -X POST \
            "${{ secrets.YUNZHIJIA_NOTIFY_URL }}?access_token=${{ secrets.YUNZHIJIA_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$AUTHOR_NAME\",
              \"type\": \"link\",
              \"text\": \"你的 PR《${PR_TITLE}》变更影响分析已完成，请点击链接查看报告\",
              \"url\": \"$PR_URL\"
            }"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify failure via Yunzhijia
        # 必须带 always()：分析步骤失败会让 job 进入 failure 状态，
        # 不带 always() 的后续步骤会被 GitHub 默认跳过，导致失败静默、作者收不到通知。
        if: always() && steps.detect-java.outputs.is_java == 'true' && steps.claude-alignment-review.outcome == 'failure'
        run: |
          AUTHOR_LOGIN="${{ github.event.pull_request.user.login }}"
          AUTHOR_NAME=$(gh api users/$AUTHOR_LOGIN --jq '.name // empty' 2>/dev/null || true)

          if [ -z "$AUTHOR_NAME" ]; then
            echo "No name found for $AUTHOR_LOGIN, skipping notification"
            exit 0
          fi

          PR_TITLE="${{ github.event.pull_request.title }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "${{ secrets.YUNZHIJIA_NOTIFY_URL }}?access_token=${{ secrets.YUNZHIJIA_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$AUTHOR_NAME\",
              \"type\": \"link\",
              \"text\": \"你的 PR《${PR_TITLE}》变更影响分析执行失败，请点击链接查看详情\",
              \"url\": \"$RUN_URL\"
            }" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Skip notice (non-Java project)
        if: steps.detect-java.outputs.is_java != 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⏭️ **变更影响分析已跳过**：未检测到 Java 项目。" \
            --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
