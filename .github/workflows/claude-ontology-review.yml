# .github/workflows/claude-ontology-review.yml
name: Claude Ontology Review

on:
  workflow_call:
    inputs:
      ontology_objects:
        description: '要审核的本体对象 slug，逗号分隔，如 "invoice-data,credit-note-apply"。留空则自动探测'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ANTHROPIC_BASE_URL:
        required: false
      ONTOLOGY_MCP_URL:
        required: true
      ONTOLOGY_MCP_TOKEN:
        required: true
      YUNZHIJIA_NOTIFY_URL:
        required: false
      YUNZHIJIA_ACCESS_TOKEN:
        required: false
      ARTIFACTS_REPO_TOKEN:
        required: false

jobs:
  ontology-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect Java project
        id: detect-java
        run: |
          if find . -name "*.java" -not -path "./.git/*" | head -1 | grep -q "."; then
            echo "is_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_java=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude Ontology Review
        if: steps.detect-java.outputs.is_java == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mcp_config: |
            {
              "mcpServers": {
                "ontology": {
                  "type": "http",
                  "url": "${{ secrets.ONTOLOGY_MCP_URL }}",
                  "headers": {
                    "Authorization": "Bearer ${{ secrets.ONTOLOGY_MCP_TOKEN }}"
                  }
                }
              }
            }
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            AUTHOR: ${{ github.event.pull_request.user.login }}
            ONTOLOGY_OBJECTS: ${{ inputs.ontology_objects }}

            请对这个 Pull Request 进行**本体设计与代码实现一致性审核**。

            ## 核心原则：Grep 优先，按需精读

            **禁止全量读取所有 Handler 文件**——这会导致 context 超限。
            正确做法：
            - 用 Grep 搜索关键模式，建立"疑问清单"
            - 只对疑问清单中的文件执行 Read
            - 每个审核维度独立 Grep，不混用

            ---

            ## Step 1：确定审核对象

            如果 `ONTOLOGY_OBJECTS` 非空，直接使用其中的 slug 列表。
            否则，通过以下方式自动探测：
            1. 调用 `mcp__ontology__list_object_types` 获取所有本体对象
            2. 用 Glob 扫描项目中的 `ontology/objects/` 或 `domain/` 目录，与本体对象交叉匹配
            3. 确定本次 PR 涉及的本体对象 slug 列表

            ---

            ## Step 2：从 MCP 并行获取本体定义

            对每个确定的 object_slug，**并行**调用以下 5 个 aspect：
            ```
            mcp__ontology__get_object_detail(object_slug="{slug}", aspect="actions")
            mcp__ontology__get_object_detail(object_slug="{slug}", aspect="value_sets")
            mcp__ontology__get_object_detail(object_slug="{slug}", aspect="properties")
            mcp__ontology__get_object_detail(object_slug="{slug}", aspect="functions")
            mcp__ontology__get_object_detail(object_slug="{slug}", aspect="rule_packages")
            ```

            同时并行用 Glob 建立代码结构清单：
            - `**/handler/**/*.java` 或 `**/handlers/**/*.java`
            - `**/ontology/actions/*.java`
            - `**/ontology/objects/*.java`
            - `**/ontology/types/*.java`
            - `**/ports/**/*.java`

            ---

            ## Step 3：多维度 Grep 审核（全部并行）

            ### L4 横切关注点
            ```
            Grep: "TraceRecorder"  in handlers/
            Grep: "AuditLogger"    in handlers/
            Grep: "MetricsWriter"  in handlers/
            ```
            预期：所有写操作 Handler 均应命中。未命中的加入疑问清单。

            ### L1 路由规则
            ```
            Grep: "ProfileSelectionRules" in handlers/
            ```
            预期：非外部事实写回型 Handler 均应命中。未命中的加入疑问清单。

            ### 类型安全
            ```
            Grep: "String.*Id\b" in ontology/objects/
            Grep: "String.*Id\b" in domain/
            ```
            预期：ID 字段应使用强类型包装，裸 String 加入疑问清单。

            ### 状态枚举
            ```
            Grep: "enum.*Status" in src/
            Grep: "S[0-9]{2}" in handlers/
            ```
            对照本体 value_sets 中的状态定义，找出代码中存在但本体未定义的状态。

            ### DB 列名
            ```
            Grep: "column.*=" in mapper XML 或 @Column 注解
            ```
            对照本体 properties 中的字段名，找出命名不一致的列。

            ### Port 接口
            ```
            Grep: "interface.*Port" in ports/
            ```
            对照本体 functions 定义，找出缺失或多余的 Port 方法。

            ---

            ## Step 4：精读疑问文件

            仅对 Step 3 疑问清单中的文件执行 Read，确认问题是否属实。

            ---

            ## Step 5：生成审核报告

            ### 问题汇总表格式

            | # | 级别 | 对象 | 维度 | 问题描述 | 涉及文件 |
            |---|------|------|------|---------|---------|
            | 1 | 🔴 严重 | ... | ... | ... | ... |
            | 2 | 🟡 警告 | ... | ... | ... | ... |
            | 3 | 🔵 建议 | ... | ... | ... | ... |

            级别定义：
            - 🔴 严重：本体定义的必要约束在代码中完全缺失
            - 🟡 警告：实现与本体有偏差，需与产品对齐确认
            - 🔵 建议：可优化项，不影响正确性

            ### 输出方式
            - 每个具体问题使用 `mcp__github_inline_comment__create_inline_comment` 标注到对应代码行
            - 最终用 `gh pr comment` 添加包含问题汇总表的总结评论
            - 报告语言：中文

            ### 无问题时
            如果本项目不包含本体相关代码，或本次 PR 未涉及本体对象，请用 `gh pr comment` 说明跳过原因。

            ### 写入审核报告文件（必须执行）
            完成所有评论后，将完整的问题汇总表（Markdown 格式）写入 `/tmp/ontology-review-report.md`。
            - 文件第一行必须是 `HAS_ISSUES` 或 `NO_ISSUES`（根据是否存在 🔴 严重 级别问题）
            - 第二行空行
            - 第三行起为完整的审核报告正文（包含问题汇总表）
            - 若跳过审核，写入 `NO_ISSUES` 并说明跳过原因

          claude_args: |
            --allowedTools "mcp__ontology__list_object_types,mcp__ontology__list_documents,mcp__ontology__get_object_detail,mcp__ontology__get_document,mcp__github_inline_comment__create_inline_comment,Bash,Read,Glob,Grep,LS"
            --max-turns 40

      - name: Save review report to artifacts repo
        if: steps.detect-java.outputs.is_java == 'true'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          TODAY=$(date +%Y-%m-%d)

          # 从 PR 标题或分支名提取 Linear Issue ID（如 CNPRD-314）
          LINEAR_ID=$(echo "$PR_TITLE ${{ github.event.pull_request.head.ref }}" \
            | grep -oiE '[A-Z]+-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')

          if [ -z "$LINEAR_ID" ]; then
            echo "No Linear issue ID found, skipping artifact upload"
            exit 0
          fi

          REPORT_FILE="/tmp/ontology-review-report.md"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "Report file not found, skipping artifact upload"
            exit 0
          fi

          # Clone artifacts repo
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.ARTIFACTS_REPO_TOKEN }}@github.com/invagent/develop-workflow-artifacts.git" \
            /tmp/artifacts-repo

          # 创建目录
          mkdir -p "/tmp/artifacts-repo/${LINEAR_ID}/ontology-review"

          # 写入报告（保留第一行 HAS_ISSUES/NO_ISSUES 标记，供 linear-fix-trigger 读取）
          TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)
          cp "$REPORT_FILE" "/tmp/artifacts-repo/${LINEAR_ID}/ontology-review/${TIMESTAMP}-PR.md"

          # 确保 issue 目录有 README
          if [ ! -f "/tmp/artifacts-repo/${LINEAR_ID}/README.md" ]; then
            echo "# ${LINEAR_ID}" > "/tmp/artifacts-repo/${LINEAR_ID}/README.md"
            echo "" >> "/tmp/artifacts-repo/${LINEAR_ID}/README.md"
            echo "PR: https://github.com/${REPO}/pull/${PR_NUMBER}" >> "/tmp/artifacts-repo/${LINEAR_ID}/README.md"
          fi

          cd /tmp/artifacts-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "${LINEAR_ID}/"
          git commit -m "chore: add ontology review report for ${LINEAR_ID} PR#${PR_NUMBER}" || echo "Nothing to commit"
          git push
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify user via Yunzhijia
        if: always() && steps.detect-java.outputs.is_java == 'true'
        run: |
          AUTHOR_LOGIN="${{ github.event.pull_request.user.login }}"
          AUTHOR_NAME=$(gh api users/$AUTHOR_LOGIN --jq '.name // empty' 2>/dev/null || true)

          if [ -z "$AUTHOR_NAME" ]; then
            echo "No Chinese name found for $AUTHOR_LOGIN, skipping notification"
            exit 0
          fi

          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          curl -s -X POST \
            "${{ secrets.YUNZHIJIA_NOTIFY_URL }}?access_token=${{ secrets.YUNZHIJIA_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$AUTHOR_NAME\",
              \"type\": \"link\",
              \"text\": \"你的 PR《${PR_TITLE}》本体审核已完成，请点击链接查看审核结果\",
              \"url\": \"$PR_URL\"
            }"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Skip notice (non-Java project)
        if: steps.detect-java.outputs.is_java != 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⏭️ **本体审核已跳过**：未检测到 Java 项目，本体一致性审核仅适用于 Java 项目。" \
            --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}
