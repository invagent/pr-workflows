# .github/workflows/jenkins-autotest.yml
name: Trigger Jenkins Autotest

on:
  workflow_call:
    inputs:
      # 以下入参对齐 at-automated-test 的实际参数定义，可用
      # /job/at-automated-test/api/json?tree=property[parameterDefinitions[name,choices]] 查证
      run_mode:
        description: >-
          RUN_MODE（选项参数）。收票：smoke 冒烟 / full 全量 / tax_full 税局下票 /
          scenario 单场景（需 scenario_file）；开票：issue_invoice（再由 issue_mode 细分）；
          国际开票：ipd_full / ipd_scenario；按接口回归：api_path（需 api_path 入参）
        required: true
        type: string
      issue_mode:
        description: >-
          ISSUE_MODE（选项参数，仅 run_mode=issue_invoice 时有效）：
          smoke / all / specified / benti / scenario / debug。
          留空则不传，由 Jenkins 用其默认值 —— 注意它的选项里没有空串，传空串会 HTTP 500
        required: false
        type: string
        default: ''
      issue_type:
        description: '【已废弃】at-automated-test 并无此参数，传了会被忽略。保留声明仅为兼容旧调用方'
        required: false
        type: string
        default: ''
      invoice_channel:
        description: 'INVOICE_CHANNEL（选项参数，仅开票场景有效）：留空用 sit.yaml 默认通道 / leqi / rpa'
        required: false
        type: string
        default: ''
      scenario_file:
        description: '单场景模式下的场景文件路径，如 scenarios/receive/done/xxx.yaml'
        required: false
        type: string
        default: ''
      api_path:
        description: '接口 path 关键词，run_mode=api_path 时必填，多个用逗号分隔'
        required: false
        type: string
        default: ''
      threads:
        description: 'THREADS 并发线程数，smoke/full/all 模式下有效'
        required: false
        type: string
        default: '4'
      issue_id:
        description: >-
          Linear Issue ID，如 KNOPS-231，透传给 ISSUE_ID。
          传入时 Jenkins 才生成 Markdown 报告并上传到 artifacts 仓库，留空则跳过报告
        required: false
        type: string
        default: ''
    secrets:
      JENKINS_URL:
        required: true
      JENKINS_USER:
        required: true
      JENKINS_API_TOKEN:
        required: true
      JENKINS_AUTOTEST_TOKEN:
        required: true
      YUNZHIJIA_NOTIFY_URL:
        required: false
      YUNZHIJIA_ACCESS_TOKEN:
        required: false

jobs:
  trigger-autotest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and wait for autotest build
        run: |
          AUTH="${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"
          # 走 170.106.141.117 上的 nginx 网关：它把 /cicd-job/ 转发到内网
          # jump-test.piaozone.com:8080/job/。内网地址不对公网开放，GitHub runner
          # 只能走这个入口，所以路径段是 /cicd-job/ 而非 /job/。
          # 必须用 https：该机器 80 端口被另一个 server 块（server_name 精确匹配 IP）
          # 接管，网关的 location 只在 443 上生效；证书是自签的，故 curl 需要 -k。
          BUILD_API="${{ secrets.JENKINS_URL }}/cicd-job/at-automated-test"

          # 触发前记录当前构建号
          # curl 一律加超时：GitHub runner 到内网 Jenkins 若被防火墙丢包，
          # 不带超时的 curl 会挂到 TCP 默认超时（约 2 分钟）才返回，且只留一个
          # exit 28 —— 排查时看不出是网络不通还是接口报错。
          # 用 curl 的退出码判断连通性，不要拿 || echo 拼标记 —— curl 已经输出了
          # 状态码，标记会被追加成 "000CURL_FAILED" 之类，反而让判断落到错误分支
          set +e
          PROBE=$(curl -sk --connect-timeout 10 -m 30 -w '\n%{http_code}' -u "$AUTH" \
            "$BUILD_API/lastBuild/api/json?tree=number")
          CURL_RC=$?
          set -e
          PROBE_CODE=$(echo "$PROBE" | tail -1)

          if [ "$CURL_RC" -ne 0 ] || [ "$PROBE_CODE" = "000" ] || [ -z "$PROBE_CODE" ]; then
            echo "::error::连不上 Jenkins（curl 退出码 $CURL_RC，HTTP $PROBE_CODE）。"
            echo "::error::退出码 28 为连接超时,通常是 GitHub runner 到该地址被防火墙丢包。"
            echo "::error::请确认 JENKINS_URL 指向 GitHub runner 可达的入口,而非仅内网可达的地址。"
            exit 1
          fi
          if [ "$PROBE_CODE" != "200" ]; then
            echo "::error::读取构建号返回 HTTP $PROBE_CODE —— 路径或凭据有问题：$BUILD_API/lastBuild/api/json"
            exit 1
          fi

          BEFORE=$(echo "$PROBE" | sed '$d' | python3 -c "import sys,json; print(json.load(sys.stdin).get('number', 0))" 2>/dev/null || echo "0")
          echo "Current build number before trigger: $BEFORE"

          # 触发构建
          # 只拼有值的参数。ISSUE_MODE 与 INVOICE_CHANNEL 是选项参数,
          # 而 ISSUE_MODE 的选项里没有空串 —— 传 ISSUE_MODE= 会让 Jenkins 直接 HTTP 500。
          # 未传的参数由 Jenkins 用 job 自身默认值(ISSUE_MODE 默认 smoke),
          # 而它仅在 RUN_MODE=issue_invoice 时才生效,收票场景不传是安全的。
          # ISSUE_TYPE 已废弃：该 job 的参数定义里没有这一项。
          PARAMS="RUN_MODE=${{ inputs.run_mode }}&THREADS=${{ inputs.threads }}"

          append_if_set() {
            # $1 参数名，$2 取值；空值则跳过，避免给选项参数传出非法值
            if [ -n "$2" ]; then
              PARAMS="${PARAMS}&$1=$2"
            fi
          }

          append_if_set ISSUE_MODE      "${{ inputs.issue_mode }}"
          append_if_set INVOICE_CHANNEL "${{ inputs.invoice_channel }}"
          append_if_set SCENARIO_FILE   "${{ inputs.scenario_file }}"
          append_if_set API_PATH        "${{ inputs.api_path }}"
          append_if_set ISSUE_ID        "${{ inputs.issue_id }}"

          BUILD_URL="${BUILD_API}/buildWithParameters?token=${{ secrets.JENKINS_AUTOTEST_TOKEN }}&${PARAMS}"
          echo "触发参数：${PARAMS}"

          HTTP_CODE=$(curl -sk -o /dev/null --connect-timeout 10 -m 60 -w "%{http_code}" \
            -X POST -u "$AUTH" "$BUILD_URL" || echo "000")

          # 兜住空值与 000：直接拿去做 [ -lt ] 比较会因非整数而报语法错退出,
          # 那样日志里只剩一个 exit code,看不出到底发生了什么
          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "::error::触发请求未得到响应（连接超时或被拒绝）：$BUILD_API"
            exit 1
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::触发 autotest 构建失败（HTTP $HTTP_CODE）。500 多为参数取值非法,"
            echo "::error::可用 api/json?tree=property[parameterDefinitions[name,choices]] 核对选项参数"
            exit 1
          fi
          echo "Autotest build triggered (HTTP $HTTP_CODE), waiting for build to start..."

          # 等待新构建号出现（最多等 2 分钟）
          BUILD_NUM=""
          for i in $(seq 1 12); do
            sleep 10
            CURRENT=$(curl -sfk --connect-timeout 10 -m 30 -u "$AUTH" "$BUILD_API/lastBuild/api/json?tree=number" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number', 0))" 2>/dev/null || echo "0")
            if [ "$CURRENT" -gt "$BEFORE" ]; then
              BUILD_NUM=$CURRENT
              echo "Autotest build #$BUILD_NUM started"
              break
            fi
          done

          if [ -z "$BUILD_NUM" ]; then
            echo "Timed out waiting for autotest build to start"
            exit 1
          fi

          # 轮询构建结果（最多等 30 分钟）
          echo "Polling autotest build #$BUILD_NUM result..."
          for i in $(seq 1 30); do
            sleep 60
            RESP=$(curl -sfk --connect-timeout 10 -m 30 -u "$AUTH" "$BUILD_API/$BUILD_NUM/api/json?tree=building,result,url" 2>/dev/null || echo "{}")
            BUILDING=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('building', True))" 2>/dev/null || echo "True")
            RESULT=$(echo "$RESP"  | python3 -c "import sys,json; print(json.load(sys.stdin).get('result', ''))"  2>/dev/null || echo "")
            URL=$(echo "$RESP"     | python3 -c "import sys,json; print(json.load(sys.stdin).get('url', ''))"     2>/dev/null || echo "")

            if [ "$BUILDING" = "False" ]; then
              echo "Autotest build #$BUILD_NUM finished: $RESULT"
              echo "Details: $URL"
              if [ "$RESULT" = "SUCCESS" ]; then
                exit 0
              else
                exit 1
              fi
            fi
            echo "Still running... ($((i))min elapsed)"
          done

          echo "Timed out waiting for autotest result (30 min)"
          exit 1

      - name: Notify failure via Yunzhijia
        if: failure()
        run: |
          ACTOR_NAME=$(gh api users/${{ github.actor }} --jq '.name // empty' 2>/dev/null || true)
          if [ -z "$ACTOR_NAME" ]; then
            echo "No Chinese name found for ${{ github.actor }}, skipping notification"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "${{ secrets.YUNZHIJIA_NOTIFY_URL }}?access_token=${{ secrets.YUNZHIJIA_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$ACTOR_NAME\",
              \"type\": \"link\",
              \"text\": \"自动化测试构建失败，请点击链接查看详情\",
              \"url\": \"$RUN_URL\"
            }" || true
        env:
          GH_TOKEN: ${{ github.token }}
