# .github/workflows/jenkins-autotest.yml
name: Trigger Jenkins Autotest

on:
  workflow_call:
    inputs:
      # 以下入参对齐 at-automated-test 的实际参数定义，可用
      # /job/at-automated-test/api/json?tree=property[parameterDefinitions[name,choices]] 查证
      run_mode:
        description: >-
          RUN_MODE（选项参数）。收票：smoke 冒烟 / full 全量 / tax_full 税局下票 /
          scenario 单场景（需 scenario_file）；开票：issue_invoice（再由 issue_mode 细分）；
          国际开票：ipd_full / ipd_scenario；按接口回归：api_path（需 api_path 入参）
        required: true
        type: string
      issue_mode:
        description: >-
          ISSUE_MODE（选项参数，仅 run_mode=issue_invoice 时有效）：
          smoke / all / specified / benti / scenario / debug。
          留空则不传，由 Jenkins 用其默认值 —— 注意它的选项里没有空串，传空串会 HTTP 500
        required: false
        type: string
        default: ''
      issue_type:
        description: '【已废弃】at-automated-test 并无此参数，传了会被忽略。保留声明仅为兼容旧调用方'
        required: false
        type: string
        default: ''
      invoice_channel:
        description: 'INVOICE_CHANNEL（选项参数，仅开票场景有效）：留空用 sit.yaml 默认通道 / leqi / rpa'
        required: false
        type: string
        default: ''
      scenario_file:
        description: '单场景模式下的场景文件路径，如 scenarios/receive/done/xxx.yaml'
        required: false
        type: string
        default: ''
      api_path:
        description: '接口 path 关键词，run_mode=api_path 时必填，多个用逗号分隔'
        required: false
        type: string
        default: ''
      threads:
        description: 'THREADS 并发线程数，smoke/full/all 模式下有效'
        required: false
        type: string
        default: '4'
      issue_id:
        description: >-
          Linear Issue ID，如 KNOPS-231，透传给 ISSUE_ID。
          传入时 Jenkins 才生成 Markdown 报告并上传到 artifacts 仓库，留空则跳过报告
        required: false
        type: string
        default: ''
    secrets:
      JENKINS_URL:
        required: true
      JENKINS_USER:
        required: true
      JENKINS_API_TOKEN:
        required: true
      JENKINS_AUTOTEST_TOKEN:
        required: true
      YUNZHIJIA_NOTIFY_URL:
        required: false
      YUNZHIJIA_ACCESS_TOKEN:
        required: false

jobs:
  trigger-autotest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and wait for autotest build
        run: |
          AUTH="${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"
          # 路径段是 /job/ 而非 /cicd-job/ —— 后者实测 404，前者 200。
          # JENKINS_URL 应配为 Jenkins 根地址（如 http://host:8080），不带 /job 后缀
          BUILD_API="${{ secrets.JENKINS_URL }}/job/at-automated-test"

          # 触发前记录当前构建号
          BEFORE=$(curl -sf -u "$AUTH" "$BUILD_API/lastBuild/api/json?tree=number" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number', 0))" 2>/dev/null || echo "0")
          echo "Current build number before trigger: $BEFORE"

          # 触发构建
          # 只拼有值的参数。ISSUE_MODE 与 INVOICE_CHANNEL 是选项参数,
          # 而 ISSUE_MODE 的选项里没有空串 —— 传 ISSUE_MODE= 会让 Jenkins 直接 HTTP 500。
          # 未传的参数由 Jenkins 用 job 自身默认值(ISSUE_MODE 默认 smoke),
          # 而它仅在 RUN_MODE=issue_invoice 时才生效,收票场景不传是安全的。
          # ISSUE_TYPE 已废弃：该 job 的参数定义里没有这一项。
          PARAMS="RUN_MODE=${{ inputs.run_mode }}&THREADS=${{ inputs.threads }}"

          append_if_set() {
            # $1 参数名，$2 取值；空值则跳过，避免给选项参数传出非法值
            if [ -n "$2" ]; then
              PARAMS="${PARAMS}&$1=$2"
            fi
          }

          append_if_set ISSUE_MODE      "${{ inputs.issue_mode }}"
          append_if_set INVOICE_CHANNEL "${{ inputs.invoice_channel }}"
          append_if_set SCENARIO_FILE   "${{ inputs.scenario_file }}"
          append_if_set API_PATH        "${{ inputs.api_path }}"
          append_if_set ISSUE_ID        "${{ inputs.issue_id }}"

          BUILD_URL="${BUILD_API}/buildWithParameters?token=${{ secrets.JENKINS_AUTOTEST_TOKEN }}&${PARAMS}"
          echo "触发参数：${PARAMS}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -u "$AUTH" "$BUILD_URL")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Failed to trigger autotest build (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Autotest build triggered (HTTP $HTTP_CODE), waiting for build to start..."

          # 等待新构建号出现（最多等 2 分钟）
          BUILD_NUM=""
          for i in $(seq 1 12); do
            sleep 10
            CURRENT=$(curl -sf -u "$AUTH" "$BUILD_API/lastBuild/api/json?tree=number" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number', 0))" 2>/dev/null || echo "0")
            if [ "$CURRENT" -gt "$BEFORE" ]; then
              BUILD_NUM=$CURRENT
              echo "Autotest build #$BUILD_NUM started"
              break
            fi
          done

          if [ -z "$BUILD_NUM" ]; then
            echo "Timed out waiting for autotest build to start"
            exit 1
          fi

          # 轮询构建结果（最多等 30 分钟）
          echo "Polling autotest build #$BUILD_NUM result..."
          for i in $(seq 1 30); do
            sleep 60
            RESP=$(curl -sf -u "$AUTH" "$BUILD_API/$BUILD_NUM/api/json?tree=building,result,url" 2>/dev/null || echo "{}")
            BUILDING=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('building', True))" 2>/dev/null || echo "True")
            RESULT=$(echo "$RESP"  | python3 -c "import sys,json; print(json.load(sys.stdin).get('result', ''))"  2>/dev/null || echo "")
            URL=$(echo "$RESP"     | python3 -c "import sys,json; print(json.load(sys.stdin).get('url', ''))"     2>/dev/null || echo "")

            if [ "$BUILDING" = "False" ]; then
              echo "Autotest build #$BUILD_NUM finished: $RESULT"
              echo "Details: $URL"
              if [ "$RESULT" = "SUCCESS" ]; then
                exit 0
              else
                exit 1
              fi
            fi
            echo "Still running... ($((i))min elapsed)"
          done

          echo "Timed out waiting for autotest result (30 min)"
          exit 1

      - name: Notify failure via Yunzhijia
        if: failure()
        run: |
          ACTOR_NAME=$(gh api users/${{ github.actor }} --jq '.name // empty' 2>/dev/null || true)
          if [ -z "$ACTOR_NAME" ]; then
            echo "No Chinese name found for ${{ github.actor }}, skipping notification"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "${{ secrets.YUNZHIJIA_NOTIFY_URL }}?access_token=${{ secrets.YUNZHIJIA_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$ACTOR_NAME\",
              \"type\": \"link\",
              \"text\": \"自动化测试构建失败，请点击链接查看详情\",
              \"url\": \"$RUN_URL\"
            }" || true
        env:
          GH_TOKEN: ${{ github.token }}
