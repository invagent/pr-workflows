# .github/workflows/jenkins-deploy.yml
name: Trigger Jenkins Deploy

on:
  workflow_call:
    inputs:
      service:
        description: 'Jenkins SERVICE 参数'
        required: true
        type: string
      branch:
        description: 'Jenkins BRANCH 参数'
        required: false
        type: string
        default: 'test'
      deploy:
        description: 'Jenkins DEPLOY 参数'
        required: false
        type: string
        default: 'true'
    secrets:
      JENKINS_URL:
        required: true
      JENKINS_USER:
        required: true
      JENKINS_API_TOKEN:
        required: true
      JENKINS_PIPELINE_TOKEN:
        required: true

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins build
        run: |
          HTTP_CODE=$(curl -s -o /tmp/jenkins_resp.txt -w "%{http_code}" \
            -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/cicd-trigger?token=${{ secrets.JENKINS_PIPELINE_TOKEN }}&SERVICE=${{ inputs.service }}&BRANCH=${{ inputs.branch }}&DEPLOY=${{ inputs.deploy }}")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/jenkins_resp.txt || true

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Jenkins build triggered successfully"
          else
            echo "Failed to trigger Jenkins build (HTTP $HTTP_CODE)"
            exit 1
          fi
