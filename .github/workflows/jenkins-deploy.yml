# .github/workflows/jenkins-deploy.yml
name: Trigger Jenkins Deploy

on:
  workflow_call:
    inputs:
      service:
        description: 'Jenkins SERVICE 参数'
        required: true
        type: string
      branch:
        description: 'Jenkins BRANCH 参数'
        required: false
        type: string
        default: 'test'
      poll_timeout_minutes:
        description: >-
          等待构建结果的最长分钟数。部署构建通常十几分钟,默认 45 留足余量。
          超时不代表构建失败——它仍在 Jenkins 上继续跑，只是本 job 不再等待
        required: false
        type: string
        default: '45'
      deploy:
        description: 'Jenkins DEPLOY 参数'
        required: false
        type: string
        default: 'true'
    secrets:
      JENKINS_URL:
        required: true
      JENKINS_USER:
        required: true
      JENKINS_API_TOKEN:
        required: true
      JENKINS_PIPELINE_TOKEN:
        required: true
      YUNZHIJIA_NOTIFY_URL:
        required: false
      YUNZHIJIA_ACCESS_TOKEN:
        required: false

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and wait for Jenkins build
        run: |
          AUTH="${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"
          # 走 170.106.141.117 上的 nginx 网关：它把 /cicd-job/ 转发到内网
          # jump-test.piaozone.com:8080/job/。内网地址不对公网开放，GitHub runner
          # 只能走这个入口，所以路径段是 /cicd-job/ 而非 /job/。
          # 必须用 https：该机器 80 端口被另一个 server 块（server_name 精确匹配 IP）
          # 接管，网关的 location 只在 443 上生效；证书是自签的，故 curl 需要 -k。
          # cicd-pipeline 与 cicd-pipeline-at 两个 job 都真实存在，此处沿用原有的 -at
          BUILD_API="${{ secrets.JENKINS_URL }}/cicd-job/cicd-pipeline-at"

          # 触发前记录当前构建号
          BEFORE=$(curl -sfk --connect-timeout 10 -m 30 -u "$AUTH" "$BUILD_API/lastBuild/api/json?tree=number" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number', 0))" 2>/dev/null || echo "0")
          echo "Current build number before trigger: $BEFORE"

          # 触发构建
          HTTP_CODE=$(curl -sk -o /dev/null --connect-timeout 10 -m 60 -w "%{http_code}" \
            -X POST -u "$AUTH" \
            "${BUILD_API}/buildWithParameters?token=${{ secrets.JENKINS_PIPELINE_TOKEN }}&SERVICE=${{ inputs.service }}&BRANCH=${{ inputs.branch }}&DEPLOY=${{ inputs.deploy }}")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Failed to trigger Jenkins build (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Build triggered (HTTP $HTTP_CODE), waiting for build to start..."

          # 等待新构建号出现（最多等 2 分钟）
          BUILD_NUM=""
          for i in $(seq 1 12); do
            sleep 10
            CURRENT=$(curl -sfk --connect-timeout 10 -m 30 -u "$AUTH" "$BUILD_API/lastBuild/api/json?tree=number" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number', 0))" 2>/dev/null || echo "0")
            if [ "$CURRENT" -gt "$BEFORE" ]; then
              BUILD_NUM=$CURRENT
              echo "Build #$BUILD_NUM started"
              break
            fi
          done

          if [ -z "$BUILD_NUM" ]; then
            echo "Timed out waiting for build to start"
            exit 1
          fi

          # 轮询构建结果（最多等 30 分钟）
          # 轮询上限由 poll_timeout_minutes 决定（每轮 60 秒）
          POLL_MAX="${{ inputs.poll_timeout_minutes }}"
          echo "Polling build #$BUILD_NUM result（最多 ${POLL_MAX} 分钟）..."
          for i in $(seq 1 "$POLL_MAX"); do
            sleep 60
            RESP=$(curl -sfk --connect-timeout 10 -m 30 -u "$AUTH" "$BUILD_API/$BUILD_NUM/api/json?tree=building,result,url" 2>/dev/null || echo "{}")
            BUILDING=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('building', True))" 2>/dev/null || echo "True")
            RESULT=$(echo "$RESP"  | python3 -c "import sys,json; print(json.load(sys.stdin).get('result', ''))"  2>/dev/null || echo "")
            URL=$(echo "$RESP"     | python3 -c "import sys,json; print(json.load(sys.stdin).get('url', ''))"     2>/dev/null || echo "")

            if [ "$BUILDING" = "False" ]; then
              echo "Build #$BUILD_NUM finished: $RESULT"
              echo "Details: $URL"
              if [ "$RESULT" = "SUCCESS" ]; then
                exit 0
              else
                exit 1
              fi
            fi
            echo "Still building... ($((i))min elapsed)"
          done

          echo "::error::等待构建 #$BUILD_NUM 结果超时（已等 ${POLL_MAX} 分钟）。"
          echo "::error::构建可能仍在 Jenkins 上继续执行，本 job 只是不再等待——"
          echo "::error::请查看 $BUILD_API/$BUILD_NUM/ 确认最终结果；"
          echo "::error::若该类构建常态超过 ${POLL_MAX} 分钟，调大 poll_timeout_minutes 入参。"
          exit 1

      - name: Notify failure via Yunzhijia
        if: failure()
        run: |
          ACTOR_NAME=$(gh api users/${{ github.actor }} --jq '.name // empty' 2>/dev/null || true)
          if [ -z "$ACTOR_NAME" ]; then
            echo "No Chinese name found for ${{ github.actor }}, skipping notification"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "${{ secrets.YUNZHIJIA_NOTIFY_URL }}?access_token=${{ secrets.YUNZHIJIA_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$ACTOR_NAME\",
              \"type\": \"link\",
              \"text\": \"部署构建失败，请点击链接查看详情\",
              \"url\": \"$RUN_URL\"
            }" || true
        env:
          GH_TOKEN: ${{ github.token }}
